services:

  # ========== BASES DE DONNÉES ==========

  # Base de données Auth Service
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - projet-medical-network

  # Base de données RDV Service
  postgres-rdv:
    image: postgres:15
    container_name: bdd_rdv
    environment:
      POSTGRES_DB: rdv_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projet-medical-network

  # Base de données Patient Service
  mongodb:
    image: mongo:6
    container_name: bdd_patients
    environment:
      MONGO_INITDB_DATABASE: patients_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - projet-medical-network

  # Message Broker RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secret123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - projet-medical-network

  # ========== SERVICES ==========

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: monSecretJWT2024
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - auth-db
    networks:
      - projet-medical-network

  # Patient Service
  patient-service:
    build: ./patient-service
    container_name: patient-service
    ports:
      - "3002:3002"
    environment:
      MONGODB_URL: mongodb://mongodb:27017/patients_db
    depends_on:
      - mongodb
    networks:
      - projet-medical-network

  # RDV Service
  rdv-service:
    build: ./rdv-service
    container_name: rdv-service
    ports:
      - "3003:3003"
    environment:
      DB_HOST: postgres-rdv
      DB_PORT: 5432
      DB_NAME: rdv_db
      DB_USER: admin
      DB_PASSWORD: secret123
      RABBITMQ_URL: amqp://admin:secret123@rabbitmq:5672
    depends_on:
      - postgres-rdv
      - rabbitmq
    networks:
      - projet-medical-network

  # Notification Service
  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "3004:3004"
    environment:
      RABBITMQ_URL: amqp://admin:secret123@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - projet-medical-network

  # Frontend React
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - projet-medical-network

  # API Gateway Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - frontend
    networks:
      - projet-medical-network

networks:
  projet-medical-network:
    driver: bridge

volumes:
  auth-db-data:
  postgres_data:
  mongo_data:
  rabbitmq_data: