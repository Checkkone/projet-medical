name: CI — Tests Automatiques

on:
  push:
    branches: [main, develop, feature/e1-auth, feature/e1-frontend, feature/e2-infra]
  pull_request:
    branches: [main, develop]

jobs:

  # Tests Auth Service (Node.js)
  test-auth-service:
    name: Tests Auth Service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances
        run: cd auth-service && npm install

      - name: Créer la table users
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d auth_db -c "
          CREATE TABLE IF NOT EXISTS users (
            id SERIAL PRIMARY KEY,
            nom VARCHAR(100) NOT NULL,
            email VARCHAR(150) UNIQUE NOT NULL,
            password_hash VARCHAR(255) NOT NULL,
            role VARCHAR(20) DEFAULT 'patient',
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );"

      - name: Lancer les tests
        run: cd auth-service && npm test
        env:
          PORT: 3001
          JWT_SECRET: monSecretJWT2024
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: auth_db
          DB_USER: postgres
          DB_PASSWORD: postgres

  # Tests Patient Service (Python)
  test-patient-service:
    name: Tests Patient Service
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          cd patient-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lancer les tests
        run: |
          cd patient-service
          pytest tests/test_patients.py -v

  # Tests RDV Service (Node.js)
  test-rdv-service:
    name: Tests RDV Service
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Installer les dépendances
        run: |
          cd rdv-service
          npm install

      - name: Lancer les tests
        run: |
          cd rdv-service
          npm test